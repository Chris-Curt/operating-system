name: Fork auto build

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "fork/**"
      - ".github/workflows/fork-policy.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: fork-auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch HAOS Proxmox + USB build
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch existing OS build workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yaml",
              ref: "dev",
              inputs: {
                boards: "ova,generic-x86-64",
                publish: "false",
                run_tests: "false",
                hassio_channel: "dev",
              },
            })
