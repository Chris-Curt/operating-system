name: Fork build

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ova
            make_target: ova
            artifact_name: haos-proxmox-qcow2
            image_glob: output/images/haos_ova-*.qcow2.xz
            rauc_glob: output/images/haos_ova-*.raucb
          - target: generic-x86-64
            make_target: generic_x86_64
            artifact_name: haos-usb-img
            image_glob: output/images/haos_generic-x86-64-*.img.xz
            rauc_glob: output/images/haos_generic-x86-64-*.raucb
    env:
      CACHE_DIR: ${{ github.workspace }}/.haos-cache

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Validate fork policy
        run: bash fork/scripts/policy-check.sh

      - name: Compute Buildroot cache key
        id: cache-key
        shell: bash
        run: |
          echo "buildroot=$(git -C buildroot rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Restore Buildroot download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}/dl
          key: haos-dl-${{ runner.os }}-${{ steps.cache-key.outputs.buildroot }}-${{ hashFiles('buildroot-external/package/**/*.mk') }}
          restore-keys: |
            haos-dl-${{ runner.os }}-${{ steps.cache-key.outputs.buildroot }}-
            haos-dl-${{ runner.os }}-

      - name: Restore target compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}/cc
          key: haos-cc-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            haos-cc-${{ runner.os }}-${{ matrix.target }}-

      - name: Set unique development version
        shell: bash
        run: |
          VERSION_SUFFIX="dev${GITHUB_RUN_NUMBER}"
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${VERSION_SUFFIX}\2/" buildroot-external/meta
          grep '^VERSION_' buildroot-external/meta

      - name: Configure RAUC signing key when repository secrets exist
        shell: bash
        env:
          RAUC_CERTIFICATE_B64: ${{ secrets.RAUC_CERTIFICATE_B64 }}
          RAUC_PRIVATE_KEY_B64: ${{ secrets.RAUC_PRIVATE_KEY_B64 }}
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          b64_cert_set=false
          b64_key_set=false
          legacy_cert_set=false
          legacy_key_set=false
          [[ -n "${RAUC_CERTIFICATE_B64}" ]] && b64_cert_set=true
          [[ -n "${RAUC_PRIVATE_KEY_B64}" ]] && b64_key_set=true
          [[ -n "${RAUC_CERTIFICATE}" ]] && legacy_cert_set=true
          [[ -n "${RAUC_PRIVATE_KEY}" ]] && legacy_key_set=true

          if [[ "${b64_cert_set}" != "${b64_key_set}" ]]; then
            echo "::error::RAUC_CERTIFICATE_B64 and RAUC_PRIVATE_KEY_B64 must either both be configured or both be absent."
            exit 1
          fi
          if [[ "${legacy_cert_set}" != "${legacy_key_set}" ]]; then
            echo "::error::RAUC_CERTIFICATE and RAUC_PRIVATE_KEY must either both be configured or both be absent."
            exit 1
          fi
          if [[ "${b64_cert_set}" == true && "${legacy_cert_set}" == true ]]; then
            echo "::error::Configure either the Base64 RAUC secrets or the legacy RAUC secrets, not both."
            exit 1
          fi

          if [[ "${b64_cert_set}" == true ]]; then
            printf '%s' "${RAUC_CERTIFICATE_B64}" | base64 --decode > cert.pem
            printf '%s' "${RAUC_PRIVATE_KEY_B64}" | base64 --decode > key.pem
            echo "Using Base64 encoded repository RAUC signing key."
          elif [[ "${legacy_cert_set}" == true ]]; then
            printf '%s\n' '-----BEGIN CERTIFICATE-----' "${RAUC_CERTIFICATE}" '-----END CERTIFICATE-----' > cert.pem
            printf '%s\n' '-----BEGIN PRIVATE KEY-----' "${RAUC_PRIVATE_KEY}" '-----END PRIVATE KEY-----' > key.pem
            echo "Using legacy repository RAUC signing key. Migrate to the *_B64 secrets."
          else
            echo "No persistent RAUC key configured; HAOS will generate a development self-signed key for this build."
            exit 0
          fi

          chmod 600 key.pem
          openssl x509 -in cert.pem -noout >/dev/null
          openssl pkey -in key.pem -check -noout >/dev/null

          cert_pub="$(openssl x509 -in cert.pem -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          key_pub="$(openssl pkey -in key.pem -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          if [[ "${cert_pub}" != "${key_pub}" ]]; then
            echo "::error::RAUC certificate and private key do not belong together."
            exit 1
          fi

          openssl x509 -in cert.pem -noout -subject -issuer -dates

      - name: Free disk space and prepare build directory
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          mkdir -p "${CACHE_DIR}/dl" "${CACHE_DIR}/cc" "${GITHUB_WORKSPACE}/output"
          df -h

      - name: Build HAOS image
        shell: bash
        run: scripts/enter.sh make "${{ matrix.make_target }}"

      - name: Verify required artifacts
        shell: bash
        env:
          IMAGE_GLOB: ${{ matrix.image_glob }}
          RAUC_GLOB: ${{ matrix.rauc_glob }}
        run: |
          mapfile -t images < <(compgen -G "${IMAGE_GLOB}" || true)
          mapfile -t bundles < <(compgen -G "${RAUC_GLOB}" || true)

          if [[ ${#images[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one install image matching ${IMAGE_GLOB}; found ${#images[@]}."
            exit 1
          fi
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one RAUC bundle matching ${RAUC_GLOB}; found ${#bundles[@]}."
            exit 1
          fi

          xz -t "${images[0]}"
          sha256sum "${images[0]}" "${bundles[0]}" | tee output/SHA256SUMS

      - name: Upload install image and update bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          if-no-files-found: error
          retention-days: 14
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: |
            ${{ matrix.image_glob }}
            ${{ matrix.rauc_glob }}
            output/SHA256SUMS

      - name: Remove RAUC signing material
        if: always()
        shell: bash
        run: rm -f cert.pem key.pem
