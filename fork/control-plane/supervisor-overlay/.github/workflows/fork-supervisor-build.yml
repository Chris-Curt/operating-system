name: Fork supervisor build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Supervisor image version/tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-supervisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish amd64 Supervisor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      DEFAULT_PYTHON: "3.14.6"
      SUPERVISOR_VERSION: ${{ inputs.version }}
      WHEELS_ABI: cp314
      WHEELS_TAG: musllinux_1_2
      WHEELS_APK_DEPS: "libffi-dev;openssl-dev;yaml-dev"
      WHEELS_SKIP_BINARY: aiohttp

    steps:
      - name: Checkout Supervisor fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and registry name
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SUPERVISOR_VERSION}" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker-compatible Supervisor version/tag: ${SUPERVISOR_VERSION}"
            exit 1
          fi
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ ! "${owner_lc}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Repository owner cannot be represented safely as a GHCR namespace: ${GITHUB_REPOSITORY_OWNER}"
            exit 1
          fi
          image="ghcr.io/${owner_lc}/amd64-hassio-supervisor"
          echo "owner_lc=${owner_lc}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${image}:${SUPERVISOR_VERSION}"

      - name: Write env-file for local wheels
        shell: bash
        run: |
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" > .env_file

      - name: Build local amd64 wheels
        uses: home-assistant/wheels@9e17ab1ed5c4c79d8b61e29fa63de25ca2710716 # 2026.07.0
        with:
          wheels-host: ""
          wheels-user: ""
          wheels-key: ""
          local-wheels-repo-path: "wheels/"
          abi: ${{ env.WHEELS_ABI }}
          tag: ${{ env.WHEELS_TAG }}
          arch: amd64
          apk: ${{ env.WHEELS_APK_DEPS }}
          skip-binary: ${{ env.WHEELS_SKIP_BINARY }}
          env-file: true
          requirements: "requirements.txt"

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Create Supervisor source hash
        shell: bash
        run: |
          python3 -m pip install setuptools dirhash
          dir_hash="$(dirhash "${GITHUB_WORKSPACE}/supervisor" -a sha256 --match '*.py')"
          printf '%s\n' "${dir_hash}" > rootfs/supervisor.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3

      - name: Sign Supervisor source hash
        shell: bash
        run: cosign sign-blob --yes rootfs/supervisor.sha256 --bundle rootfs/supervisor.sha256.sig

      - name: Build, publish and sign Supervisor image
        id: build
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: amd64
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          container-registry-username: ${{ github.repository_owner }}
          cosign-base-identity: 'https://github.com/home-assistant/docker-base/.*'
          cosign-base-verify: ghcr.io/home-assistant/base-python:3.14-alpine3.24
          image: ${{ steps.registry.outputs.image }}
          image-tags: ${{ env.SUPERVISOR_VERSION }}
          push: true
          version: ${{ env.SUPERVISOR_VERSION }}

      - name: Verify published image exists
        shell: bash
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        run: docker buildx imagetools inspect "${IMAGE}:${SUPERVISOR_VERSION}"

      - name: Build summary
        shell: bash
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "# Fork Supervisor build"
            echo
            echo "- Architecture: amd64"
            echo "- Image: \`${IMAGE}:${SUPERVISOR_VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Source hash: \`$(cat rootfs/supervisor.sha256)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
